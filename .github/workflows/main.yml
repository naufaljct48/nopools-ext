name: Bundle and Publish Sources
on: 
  push:
    branches:
      - '**'
      - '!main'
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    name: Bundle and Publish Sources
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x] 

    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4.1.2
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v4.0.2
        with:
          node-version: ${{ matrix.node-version }}

      
      - name: Extract branch name
        shell: bash
        run: echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Checkout existing bundles
        uses: actions/checkout@v4.1.2
        continue-on-error: true
        with:
          ref: gh-pages
          path: bundles

      - run: npm install
      - run: npm run bundle -- --folder=${{ steps.extract_branch.outputs.branch }}

      - name: Generate site + sync READMEs
        run: node scripts/generate-site.js bundles/${{ steps.extract_branch.outputs.branch }} --readme bundles/README.md --root bundles

      - name: Commit README changes back to source branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- README.md; then
            git add README.md
            git commit -m "docs: auto-sync README source table [skip ci]"
            git push
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          branch: gh-pages
          folder: bundles